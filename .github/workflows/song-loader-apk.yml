name: Build Home Customization APK

on:
  push:
    branches: [feature/home-customization]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android build tools
        run: |
          sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0' 'cmake;3.22.1'
          if [ ! -d "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"
          fi
      - name: Restore preview signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: bitchord-home-preview-signing-v2
      - name: Create preview signing key if needed
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -dname 'CN=Android Debug,O=Android,C=US' -keyalg RSA -keysize 2048 -validity 10000
          fi
      - name: Test home and preload policies
        run: ./gradlew :app:testDevDebugUnitTest --tests 'com.music.bitchord.PreloadPolicyTest' --tests 'com.music.bitchord.HomeLayoutTest' -PhomePreview=true --no-daemon --max-workers=2 -Dorg.gradle.parallel=false '-Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8'
      - name: Build installable development APK
        run: ./gradlew :app:assembleDevDebug :app:assembleDevDebugAndroidTest -PhomePreview=true --no-daemon --max-workers=2 -Dorg.gradle.parallel=false '-Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8'
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BitChord-Home-APK
          path: app/build/outputs/apk/dev/debug/*universal*.apk
          if-no-files-found: error
      - name: Upload UI test APK
        uses: actions/upload-artifact@v4
        with:
          name: home-ui-test-apk
          path: app/build/outputs/apk/androidTest/dev/debug/*.apk
          if-no-files-found: error
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: home-test-reports
          path: app/build/reports/tests/testDevDebugUnitTest/
          if-no-files-found: ignore

  ui-smoke:
    needs: apk
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: BitChord-Home-APK
          path: apk
      - uses: actions/download-artifact@v4
        with:
          name: home-ui-test-apk
          path: tests
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Home UI smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          script: |
            adb install apk/*.apk
            adb install tests/*.apk
            adb shell am instrument -w -r -e class com.music.bitchord.HomeCustomizationUiTest com.dev.bitchord.home.test/androidx.test.runner.AndroidJUnitRunner | tee ui-results.txt
            adb pull /sdcard/Android/data/com.dev.bitchord.home/files/home-ui screenshots
            grep -q 'OK (2 tests)' ui-results.txt
      - name: Upload UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: home-ui-screenshots
          path: |
            screenshots/
            ui-results.txt
