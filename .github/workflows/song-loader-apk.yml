name: Build Song Loader APK

on:
  push:
    branches: [build/song-loader-apk]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android build tools
        run: sdkmanager 'platforms;android-37' 'build-tools;36.0.0' 'cmake;3.22.1'
      - name: Test preload policy
        run: ./gradlew :app:testDevDebugUnitTest --tests 'com.music.bitchord.PreloadPolicyTest' --no-daemon --max-workers=2 -Dorg.gradle.parallel=false '-Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8'
      - name: Build installable development APK
        run: ./gradlew :app:assembleDevDebug --no-daemon --max-workers=2 -Dorg.gradle.parallel=false '-Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8'
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BitChord-song-loader-APK
          path: app/build/outputs/apk/dev/debug/*universal*.apk
          if-no-files-found: error
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: song-loader-test-reports
          path: app/build/reports/tests/testDevDebugUnitTest/
          if-no-files-found: ignore
